[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "social-librarian"
version = "0.1.0"
description = "Mirror Bluesky to Mastodon once; expire old content everywhere, on a per-instance policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alvaro", email = "hirrolot@polarisocial.xyz" }]
keywords = ["bluesky", "mastodon", "fediverse", "atproto", "ephemeral", "archive"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications",
  "Topic :: Internet",
]

[project.urls]
Homepage = "https://github.com/8ullyMaguire/social-librarian"
Issues = "https://github.com/8ullyMaguire/social-librarian/issues"

[project.scripts]
social-librarian = "librarian.cli:main"
librarian = "librarian.cli:main"

[tool.setuptools]
packages = ["librarian", "librarian.adapters"]
